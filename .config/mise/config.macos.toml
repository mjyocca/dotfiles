# macOS-specific mise configuration
# Extends base config.toml with macOS-only packages
# Selected via MISE_ENV=macos (exported by Make or macOS zsh startup).

[bootstrap]
dotfile_groups = [
  "asdf", "bash", "bat", "btop", "colima", "colima-scripts", "ghostty",
  "gitconfig", "herdr", "hunk", "lazygit", "mise", "nvim", "nvim-next",
  "opencode", "pnpm", "scripts", "ssh", "starship", "superfile", "tmux",
  "tool-versions", "yazi", "zed", "zellij", "zsh",
]

[bootstrap.brew]
# Prevents errors when reinstalling casks (fonts, apps) that already exist
# Fixed in mise PR #13262 (Sep 2026) - now works correctly in all bootstrap paths
adopt = true

[bootstrap.packages]
# macOS-only packages (Homebrew)

# Version Managers (except mise - prerequisites install it)
"brew:asdf" = "latest"

# System infrastructure and general utilities
"brew:autoconf" = "latest"
"brew:cmake" = "latest"
"brew:curl" = "latest"
"brew:coreutils" = "latest"
"brew:gcc" = "latest"
"brew:gmp" = "latest"
"brew:git" = "latest"
"brew:libyaml" = "latest"
"brew:make" = "latest"
"brew:mas" = "latest"
"brew:openssl" = "latest"
"brew:readline" = "latest"
"brew:sqlite" = "latest"
"brew:stow" = "latest"
"brew:unzip" = "latest"
"brew:pv" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"

# macOS-specific CLI tools
"brew:figlet" = "latest"
"brew:cmatrix" = "latest"
"brew:sl" = "latest"
"brew:zsh-autosuggestions" = "latest"
"brew:zero-sh/tap/apply-user-defaults" = "latest"

# Platform-managed CLI/TUI tools
"brew:ffmpeg" = "latest"
"brew:herdr" = "latest"
"brew:bat" = "latest"
"brew:btop" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:jq" = "latest"
"brew:lazygit" = "latest"
"brew:neovim" = "latest"
"brew:ripgrep" = "latest"
"brew:starship" = "latest"
