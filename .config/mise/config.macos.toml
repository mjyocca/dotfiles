# macOS-specific mise configuration
# Complete macOS package set, preferences, and platform deployment selections.
# Selected via MISE_ENV=macos (exported by Make or macOS zsh startup).

# macOS user overrides
# -----------------------------------------------------------------------------

# Merge shared native key sequences without replacing Herdr's macOS shortcuts.
[dotfiles."~/.config/herdr-app/keys.json/tmux-prefix"]
source = "../../packages/herdr-app/.config/herdr-app/keys.json"
merge = true

# Dotfile deployment selections
# -----------------------------------------------------------------------------

[bootstrap]
dotfile_groups = [
  "asdf", "bash", "bat", "btop", "colima", "colima-scripts", "ghostty",
  "gitconfig", "herdr", "hunk", "lazygit", "nvim", "nvim-next",
  "opencode", "pnpm", "rex", "scripts", "ssh", "starship", "superfile", "tmux",
  "tool-versions", "yazi", "zed", "zellij", "zsh",
]

# macOS user preferences
# -----------------------------------------------------------------------------
# Applied by make config; leave runtime, host, and security state local.

[bootstrap.macos.defaults."com.apple.dock"]
autohide = true
"show-process-indicators" = true

[bootstrap.macos.defaults.NSGlobalDomain]
_HIHideMenuBar = true

[bootstrap.macos.defaults."com.apple.finder"]
CreateDesktop = false
AppleShowAllFiles = true

[bootstrap.macos.defaults."com.microsoft.VSCode"]
ApplePressAndHoldEnabled = false

# Rex: selected UI preferences, not the full app preferences plist.
[bootstrap.macos.defaults."com.superlogical.rex"]
# Sidebar and tabs
"Workspace.tabStyle" = "vertical"
"Workspace.sidebarPosition" = "left"
"Workspace.sidebarCollapsed" = false
"Workspace.sidebarWidth" = 279.0
"Workspace.sidebarShowsActivity" = false
"Workspace.tabIconTintMode" = "off"

# Appearance and built-in themes
"Workspace.interfaceStyle" = "blendTheme"
"Workspace.usesPaneGlass" = true
"Workspace.appIcon" = "dark"
"Workspace.lightThemeID" = "merino-light"
"Workspace.darkThemeID" = "merino-dark"
"Workspace.darkUsesExtendedThemePalette" = true

# Panes and focus indicators
"Workspace.paneDensity" = "comfortable"
"Workspace.showsActivePaneBorder" = true
"Workspace.activePaneBorderColor" = "red"
"Workspace.activePaneBorderOpacity" = 0.5197035845588235
"Workspace.inactivePaneFadeMode" = "both"
"Workspace.usesStandardInactiveWindowPaneStyles" = true

# Terminal typography and cursor
"Workspace.terminalFontPointSize" = 14.0
"Workspace.terminalCursorStyle" = "block"
"Workspace.terminalCursorStyleForced" = false
"Workspace.terminalCursorBlinkIntervalMilliseconds" = 250
"Workspace.terminalCursorBlinkUsesCustomInterval" = false

# macOS packages
# -----------------------------------------------------------------------------

[bootstrap.brew]
# Prevents errors when reinstalling casks (fonts, apps) that already exist
# Fixed in mise PR #13262 (Sep 2026) - now works correctly in all bootstrap paths
adopt = true

[bootstrap.packages]
# mise itself is installed by prerequisites before bootstrap runs.
# Keep OS filters: mise's built-in Brew manager can also run on Linux.

# Core Infrastructure
"brew:curl" = { version = "latest", os = "macos" }
"brew:git" = { version = "latest", os = "macos" }
"brew:stow" = { version = "latest", os = "macos" }
"brew:unzip" = { version = "latest", os = "macos" }
"brew:wget" = { version = "latest", os = "macos" }

# Build Tools
"brew:autoconf" = { version = "latest", os = "macos" }
"brew:cmake" = { version = "latest", os = "macos" }
"brew:gcc" = { version = "latest", os = "macos" }
"brew:gmp" = { version = "latest", os = "macos" }
"brew:libyaml" = { version = "latest", os = "macos" }
"brew:make" = { version = "latest", os = "macos" }
# Ruby 3.3's OpenSSL extension uses the OpenSSL 3 ABI; avoid the moving alias.
"brew:openssl@3" = { version = "latest", os = "macos" }
"brew:readline" = { version = "latest", os = "macos" }
"brew:sqlite" = { version = "latest", os = "macos" }

# Containers & Virtualization
