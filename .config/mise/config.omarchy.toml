# Omarchy-specific mise configuration
# Extends base config.toml with Omarchy packages and deployment selections.
# Selected via MISE_ENV=omarchy (exported by Make on detected Omarchy).

[dotfiles."~/.config/mise/conf.d/20-dotfiles-platform.toml"]
source = "global/platform.omarchy.toml"
mode = "symlink"

# Omarchy's prescribed user override; manage only this block, not the whole file.
[dotfiles."~/.config/hypr/input.lua/caps-escape"]
comment = "--"
block = '''
-- Caps Lock is Escape instead of Compose; retain the other keyboard option.
hl.config({
  input = {
    kb_options = "caps:escape,shift:both_capslock_cancel",
  },
})
'''

# Keep Omarchy's ~/.config/nvim intact; Bash selects this isolated variant.
# Group overrides replace the whole table, so retain Git manifest filtering.
[dotfile_groups.nvim]
root = "nvim/.config/nvim"
target = "~/.config/nvim-dotfiles"
manifest = "git"

[bootstrap]
dotfile_groups = [
  "asdf", "bash", "bat", "btop", "ghostty", "gitconfig", "herdr", "hunk",
  "lazygit", "nvim", "nvim-next", "opencode", "pnpm", "scripts",
  "ssh", "starship", "superfile", "tmux", "tool-versions", "yazi", "zed",
  "zellij",
]

[bootstrap.packages]
# Omarchy-only packages (pacman)

# IMPORTANT: Do NOT include mise/mise-bin here
# The prerequisites layer ensures mise is available before bootstrap runs

# Containers & Virtualization (Omarchy-specific)
"pacman:qemu-base" = "latest"

# General Utilities (Omarchy-specific)
"pacman:ffmpeg" = "latest"
"pacman:wl-clipboard" = "latest"
"pacman:resvg" = "latest" # Optional SVG previews in Yazi

# Platform-managed CLI/TUI tools (Omarchy-specific)
"pacman:herdr" = "latest"
"pacman:dua-cli" = "latest"
"pacman:lazydocker" = "latest"

# GUI Applications (from official repositories, NOT AUR)
"pacman:1password" = "latest"
"pacman:aether" = "latest"
"pacman:alacritty" = "latest"
"pacman:blender" = "latest"
"pacman:brave-bin" = "latest"
