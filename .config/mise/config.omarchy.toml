# Omarchy-specific mise configuration
# Complete Omarchy package set and platform deployment selections.
# Selected via MISE_ENV=omarchy (exported by Make on detected Omarchy).

[dotfiles."~/.config/mise/conf.d/20-dotfiles-platform.toml"]
source = "global/platform.omarchy.toml"
mode = "symlink"

# Omarchy hooks
# -----------------------------------------------------------------------------

# Herdr desktop: render the palette, then publish on theme changes.
[dotfiles."~/.config/omarchy/hooks/theme-set.d/herdr-app"]
source = "omarchy/hooks/herdr-app-theme.sh"
mode = "symlink"

[dotfiles."~/.config/omarchy/themed/herdr-app.json.tpl"]
source = "omarchy/themed/herdr-app.json.tpl"
mode = "symlink"

# Omarchy user overrides
# -----------------------------------------------------------------------------

# Merge shared native key sequences without replacing Herdr's Linux shortcuts.
[dotfiles."~/.config/herdr-app/keys.json/tmux-prefix"]
source = "../../packages/herdr-app/.config/herdr-app/keys.json"
merge = true

# Omarchy's prescribed user override; manage only this block, not the whole file.
[dotfiles."~/.config/hypr/input.lua/caps-escape"]
source = "omarchy/user-overrides/caps-escape.lua"
template = "tera"
comment = "--"

# Dotfile deployment overrides
# -----------------------------------------------------------------------------

# Keep Omarchy's ~/.config/nvim intact; Bash selects this isolated variant.
# Group overrides replace the whole table, so retain Git manifest filtering.
[dotfile_groups.nvim]
root = "nvim/.config/nvim"
target = "~/.config/nvim-dotfiles"
manifest = "git"

[bootstrap]
dotfile_groups = [
  "asdf", "bash", "bat", "btop", "ghostty", "gitconfig", "herdr", "hunk",
  "lazygit", "nvim", "nvim-next", "opencode", "pnpm", "scripts",
  "ssh", "starship", "superfile", "tmux", "tool-versions", "yazi", "zed",
  "zellij",
]

[bootstrap.packages]
