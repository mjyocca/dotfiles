# Shared user-global development tools and behavior; language versions are declared separately.
[settings]
not_found_auto_install = true
exec_auto_install = true
# Require content-bound approval for environment files and allow only registered plugins.
# https://mise.jdx.dev/configuration/settings.html#paranoid
paranoid = ["env_files", "plugins"]

[tools]
# Retained for explicit legacy use, not automatic runtime selection.
"github:asdf-vm/asdf" = "latest"
gitleaks = "latest"
fnox = "latest"
pnpm = "latest"
lazydocker = "latest"
hunk = "latest"
"aqua:anomalyco/opencode" = "latest"
"aqua:vercel-labs/agent-browser" = "latest"
gh = "latest"
kubectl = "latest"
yq = "latest"
glow = "latest"
lsd = "latest"
dua = "latest"
superfile = "latest"
television = "latest"
yazi = "latest"
