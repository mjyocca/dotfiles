# Shared user-global development tools and behavior; language versions are declared separately.
[settings]
not_found_auto_install = true
exec_auto_install = true
# Require content-bound approval for environment files and allow only registered plugins.
# https://mise.jdx.dev/configuration/settings.html#paranoid
paranoid = ["env_files", "plugins"]

[tools]
# Retained for explicit legacy use, not automatic runtime selection.
"github:asdf-vm/asdf" = "latest"
"github:zenbu-labs/terminal-browser" = { version = "latest", asset_pattern = 'terminal-browser-{{ os(macos="darwin") }}-{{ arch() }}.tar.gz' }
gitleaks = "latest"
fnox = "latest"
pnpm = "latest"
lazydocker = "latest"
hunk = "latest"
"aqua:anomalyco/opencode" = "latest"
"npm:@opencode/browse" = "latest"
"aqua:vercel-labs/agent-browser" = "latest"
gh = "latest"
kubectl = "latest"
terraform = "1.17.2"
yq = "latest"
glow = "latest"
lsd = "latest"
dua = "latest"
superfile = "latest"
television = "latest"
yazi = "latest"

# http backend installs a binary, script or archive from a download URL.
# Sourcing github.com/hashicorp/tfctl-cli from http since Mise github backend requires binaries attached to the tagged release.
[tools."http:tfctl"]
version = "latest"
url = 'https://releases.hashicorp.com/tfctl/{{ version }}/tfctl_{{ version }}_{{ os(macos="darwin") }}_{{ arch(x64="amd64") }}.zip'
checksum_url = "https://releases.hashicorp.com/tfctl/{{ version }}/tfctl_{{ version }}_SHA256SUMS"
