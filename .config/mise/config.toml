# Base mise config for dotfiles
# This file declares all dotfile groups and their settings
# Platform-specific group selection happens in config.macos.toml and config.omarchy.toml

[settings.dotfiles]
root = "../../packages"
default_mode = "symlink-each"

# =============================================================================
# Shared groups (apply to all platforms unless overridden)
# =============================================================================

[dotfile_groups.asdf]
root = "asdf"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.bat]
root = "bat"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.btop]
root = "btop"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.ghostty]
root = "ghostty"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.ghostty.entries]
"~/.config/ghostty/config" = { mode = "template" }

[dotfile_groups.gitconfig]
root = "gitconfig"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.gitconfig.entries]
"~/.gitconfig" = { mode = "template" }

[dotfile_groups.herdr]
root = "herdr"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.hunk]
root = "hunk"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.lazygit]
root = "lazygit"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.mise]
root = "mise"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.nvim]
root = "nvim"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.nvim-next]
root = "nvim-next"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.opencode]
root = "opencode"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.pnpm]
root = "pnpm"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.scripts]
root = "scripts"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.ssh]
root = "ssh"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.ssh.entries]
"~/.ssh/config" = { mode = "template" }

[dotfile_groups.starship]
root = "starship"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.superfile]
root = "superfile"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.tmux]
root = "tmux"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.tool-versions]
root = "tool-versions"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.yazi]
root = "yazi"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.zed]
root = "zed"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.zellij]
root = "zellij"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.zellij.entries]
"~/.config/zellij/config.kdl" = { mode = "template" }

# =============================================================================
# Platform-specific groups (declared here, selected in platform configs)
# =============================================================================

[dotfile_groups.bash]
root = "bash"
mode = "symlink-each"
manifest = "git"

[dotfile_groups.colima]
