# Base mise configuration for all platforms
# Shared tools, bootstrap packages, and dotfile deployment rules.
# Platform configurations select packages and dotfile groups via MISE_ENV.

# Native includes share tool declarations without deploying bootstrap rules.
include = ["tools.toml"]

[dotfiles."~/.config/mise/config.local.toml"]
source = "global.toml"
mode = "symlink"
depends = ["~/.config/mise/tools.toml"]
variants = [{ profile = "omarchy" }, { profile = "macos" }]

[dotfiles."~/.config/mise/tools.toml"]
source = "tools.toml"
mode = "symlink"
variants = [{ profile = "omarchy" }, { profile = "macos" }]

[dotfiles."~/.config/mise/miserc.toml"]
source = "miserc.toml"
mode = "symlink"

[settings.dotfiles]
root = "../../packages"
default_mode = "symlink-each"

# Deploy only tracked files; keep repository-only packages/aur out of these groups.
[dotfile_groups.asdf]
root = "asdf"
manifest = "git"

[dotfile_groups.asdf.entries]
"~/.asdfrc" = { mode = "symlink" }
"~/.asdf-direnv.sh" = { mode = "symlink" }

[dotfile_groups.bash]
root = "bash"
manifest = "git"

# Explicit targets allow a scoped apply without selecting every home-rooted group.
[dotfile_groups.bash.entries]
"~/.bashrc" = { mode = "symlink" }
"~/.bash_profile" = { mode = "symlink" }
"~/.config/bash/nvim.bash" = { mode = "symlink" }

[dotfile_groups.bat]
root = "bat"
manifest = "git"

[dotfile_groups.bat.entries]
"~/.config/bat/config" = { mode = "symlink" }
"~/.config/bat/themes/GitHub Dark.tmTheme" = { mode = "symlink" }

[dotfile_groups.btop]
root = "btop"
manifest = "git"

[dotfile_groups.btop.entries]
"~/.config/btop/btop.conf" = { mode = "symlink" }

[dotfile_groups.colima]
root = "colima"
manifest = "git"

[dotfile_groups.colima-scripts]
root = "colima-scripts"
manifest = "git"

[dotfile_groups.ghostty]
root = "ghostty"
manifest = "git"

[dotfile_groups.ghostty.entries]
"~/.config/ghostty/config" = { mode = "template" }
"~/.config/ghostty/shaders/cursor_warp.glsl" = { mode = "symlink" }

[dotfile_groups.gitconfig]
root = "gitconfig"
manifest = "git"

[dotfile_groups.gitconfig.entries]
"~/.gitconfig" = { mode = "template" }
"~/.config/git/.gitignore_global" = { mode = "symlink" }
"~/.config/git/delta-github-dark.gitconfig" = { mode = "symlink" }

[dotfile_groups.herdr]
root = "herdr"
manifest = "git"

[dotfile_groups.herdr.entries]
"~/.config/herdr/config.toml" = { mode = "symlink" }

[dotfile_groups.hunk]
root = "hunk"
manifest = "git"

[dotfile_groups.hunk.entries]
"~/.config/hunk/config.toml" = { mode = "symlink" }

[dotfile_groups.lazygit]
root = "lazygit"
manifest = "git"

[dotfile_groups.lazygit.entries]
"~/.config/lazygit/config.yml" = { mode = "symlink" }

[dotfile_groups.nvim]
root = "nvim"
manifest = "git"

[dotfile_groups.nvim-next]
root = "nvim-next"
manifest = "git"

[dotfile_groups.nvim-next.entries]
"~/.config/nvim-next" = { mode = "symlink-each" }

[dotfile_groups.opencode]
root = "opencode"
manifest = "git"
exclude = ["*.example"]

# CLI preferences are separate from server settings, providers, and credentials.
[dotfile_groups.opencode.entries]
"~/.config/opencode/cli.json" = { mode = "template" }

[dotfile_groups.pnpm]
root = "pnpm"
manifest = "git"

[dotfile_groups.pnpm.entries]
"~/.config/pnpm/config.yaml" = { mode = "symlink" }

[dotfile_groups.scripts]
root = "scripts"
manifest = "git"

[dotfile_groups.scripts.entries]
"~/.local/bin/dotf" = { mode = "symlink" }
"~/.local/bin/dotf.d/init" = { mode = "symlink" }

[dotfile_groups.ssh]
root = "ssh"
manifest = "git"

[dotfile_groups.ssh.entries]
"~/.ssh/config" = { mode = "template", permissions = "0600" }

[dotfile_groups.starship]
root = "starship"
manifest = "git"

[dotfile_groups.starship.entries]
"~/.config/starship.toml" = { mode = "symlink" }

[dotfile_groups.superfile]
root = "superfile"
manifest = "git"

[dotfile_groups.superfile.entries]
"~/.config/superfile/config.toml" = { mode = "symlink" }
"~/.config/superfile/hotkeys.toml" = { mode = "symlink" }

[dotfile_groups.tmux]
root = "tmux"
manifest = "git"

[dotfile_groups.tool-versions]
root = "tool-versions"
manifest = "git"

[dotfile_groups.tool-versions.entries]
"~/.tool-versions" = { mode = "symlink" }
"~/.default-gems" = { mode = "symlink" }

[dotfile_groups.yazi]
root = "yazi"
manifest = "git"

[dotfile_groups.yazi.entries]
"~/.config/yazi/yazi.toml" = { mode = "symlink" }

[dotfile_groups.zed]
root = "zed"
manifest = "git"

[dotfile_groups.zellij]
root = "zellij"
manifest = "git"

[dotfile_groups.zellij.entries]
"~/.config/zellij/config.kdl" = { mode = "template" }

[dotfile_groups.zsh]
root = "zsh"
manifest = "git"

[bootstrap]
# Select a platform environment before deploying; no implicit all-platform apply.
dotfile_groups = []
# mise itself is installed by the prerequisites layer before bootstrap runs
# This avoids chicken-and-egg problems during fresh installation

[bootstrap.brew]
# Prevents errors when reinstalling casks (fonts, apps) that already exist
# Fixed in mise PR #13262 (Sep 2026) - now works correctly in all bootstrap paths
adopt = true

[bootstrap.packages]
# Common packages for all platforms (brew on macOS, pacman on Omarchy)
# IMPORTANT: Do NOT include mise - prerequisites install it before bootstrap
# mise's built-in Brew manager also runs on Linux without the Homebrew CLI.
# Keep explicit OS filters; manager availability alone is not platform selection.

# Core Infrastructure
"brew:curl" = { version = "latest", os = "macos" }
"brew:git" = { version = "latest", os = "macos" }
"brew:stow" = { version = "latest", os = "macos" }
"brew:unzip" = { version = "latest", os = "macos" }
"brew:wget" = { version = "latest", os = "macos" }

"pacman:curl" = { version = "latest", os = "linux" }
"pacman:git" = { version = "latest", os = "linux" }
"pacman:stow" = { version = "latest", os = "linux" }
"pacman:unzip" = { version = "latest", os = "linux" }
"pacman:wget" = { version = "latest", os = "linux" }

# Build Tools
"brew:autoconf" = { version = "latest", os = "macos" }
"brew:cmake" = { version = "latest", os = "macos" }
"brew:gcc" = { version = "latest", os = "macos" }
"brew:gmp" = { version = "latest", os = "macos" }
"brew:libyaml" = { version = "latest", os = "macos" }
"brew:make" = { version = "latest", os = "macos" }
# Ruby 3.3's OpenSSL extension uses the OpenSSL 3 ABI; avoid the moving alias.
"brew:openssl@3" = { version = "latest", os = "macos" }
"brew:readline" = { version = "latest", os = "macos" }
"brew:sqlite" = { version = "latest", os = "macos" }

"pacman:autoconf" = { version = "latest", os = "linux" }
"pacman:base-devel" = { version = "latest", os = "linux" }
"pacman:cmake" = { version = "latest", os = "linux" }
"pacman:gcc" = { version = "latest", os = "linux" }
"pacman:gmp" = { version = "latest", os = "linux" }
"pacman:libyaml" = { version = "latest", os = "linux" }
"pacman:make" = { version = "latest", os = "linux" }
"pacman:openssl" = { version = "latest", os = "linux" }
"pacman:readline" = { version = "latest", os = "linux" }
"pacman:sqlite" = { version = "latest", os = "linux" }

# Containers & Virtualization
"brew:docker" = { version = "latest", os = "macos" }
"brew:docker-compose" = { version = "latest", os = "macos" }
"brew:docker-buildx" = { version = "latest", os = "macos" }

"pacman:docker" = { version = "latest", os = "linux" }
"pacman:docker-buildx" = { version = "latest", os = "linux" }
"pacman:docker-compose" = { version = "latest", os = "linux" }

# General Utilities
"brew:bat" = { version = "latest", os = "macos" }
"brew:btop" = { version = "latest", os = "macos" }
"brew:eza" = { version = "latest", os = "macos" }
"brew:fd" = { version = "latest", os = "macos" }
"brew:fzf" = { version = "latest", os = "macos" }
"brew:jq" = { version = "latest", os = "macos" }
"brew:lazygit" = { version = "latest", os = "macos" }
"brew:neovim" = { version = "latest", os = "macos" }
"brew:pv" = { version = "latest", os = "macos" }
"brew:ripgrep" = { version = "latest", os = "macos" }
"brew:starship" = { version = "latest", os = "macos" }
"brew:tmux" = { version = "latest", os = "macos" }
"brew:tree" = { version = "latest", os = "macos" }
"brew:tree-sitter-cli" = { version = "latest", os = "macos" }
"brew:zoxide" = { version = "latest", os = "macos" }

"pacman:bat" = { version = "latest", os = "linux" }
"pacman:btop" = { version = "latest", os = "linux" }
"pacman:eza" = { version = "latest", os = "linux" }
"pacman:fd" = { version = "latest", os = "linux" }
"pacman:fzf" = { version = "latest", os = "linux" }
"pacman:jq" = { version = "latest", os = "linux" }
"pacman:lazygit" = { version = "latest", os = "linux" }
"pacman:neovim" = { version = "latest", os = "linux" }
"pacman:pv" = { version = "latest", os = "linux" }
"pacman:ripgrep" = { version = "latest", os = "linux" }
"pacman:starship" = { version = "latest", os = "linux" }
"pacman:tmux" = { version = "latest", os = "linux" }
"pacman:tree" = { version = "latest", os = "linux" }
"pacman:tree-sitter-cli" = { version = "latest", os = "linux" }
"pacman:zoxide" = { version = "latest", os = "linux" }

# Additional session-critical tools
