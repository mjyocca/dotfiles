# Base mise configuration for all platforms
# This file defines packages common to macOS and Omarchy Linux
# Platform-specific packages go in config.macos.toml or config.omarchy.toml

[bootstrap]
# mise itself is NOT in bootstrap.packages because the Makefile installs it before bootstrap runs
# This avoids chicken-and-egg problems during fresh installation

[bootstrap.brew]
# Prevents errors when reinstalling casks (fonts, apps) that already exist
# Fixed in mise PR #13262 (Sep 2026) - now works correctly in all bootstrap paths
adopt = true

[bootstrap.packages]
# Common packages for all platforms (brew on macOS, pacman on Omarchy)
# IMPORTANT: Do NOT include mise - Makefile installs it before bootstrap

# Core Infrastructure
"brew:curl" = "latest"
"brew:git" = "latest"
