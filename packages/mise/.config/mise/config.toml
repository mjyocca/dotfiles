# Version-sensitive and optional tools managed by mise (cross-platform)
# This file is stowed to ~/.config/mise/config.toml
# See docs/instructions/package-management.md for the decision criteria

[tools]
# AI/Dev tools
gitleaks = "latest"
lazydocker = "latest"
hunk = "latest"
# aqua backend: prebuilt binaries; registry default (npm:@opencode/cli) requires a mise-managed node
"aqua:anomalyco/opencode" = "latest"

# CLI utilities
gh = "latest"
kubectl = "latest"
yq = "latest"
glow = "latest"
lsd = "latest"
dua = "latest"

# Optional cross-platform TUI tools
superfile = "latest"
television = "latest"
yazi = "latest"
